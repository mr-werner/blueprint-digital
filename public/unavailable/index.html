<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concept no longer available | Blueprint WebStudio</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07101f" />
    <link rel="icon" type="image/png" href="/blueprint-webstudio-logo-text.png" />
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --ink: #09192f; --muted: #5a6577; --line: rgba(9, 25, 47, 0.12); --accent: #0869e8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #07101f; --ink: #eef2f8; --muted: #9aa6b8; --line: rgba(238, 242, 248, 0.14); --accent: #6aa8ff; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 460px; text-align: center; }
      .mark { width: 44px; height: 44px; margin: 0 auto 28px; border: 1px solid var(--line); border-radius: 12px; display: grid; place-items: center; }
      h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; letter-spacing: -0.03em; margin-bottom: 12px; }
      p { color: var(--muted); }
      a { color: var(--accent); }
      footer { margin-top: 36px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <h1>This concept is no longer available</h1>
      <p>The preview you were looking for has been closed. If you think this is a mistake, email <a href="mailto:hello@blueprintwebstudio.com">hello@blueprintwebstudio.com</a>.</p>
      <footer><a href="https://www.blueprintwebstudio.com/">blueprintwebstudio.com</a></footer>
    </main>
  </body>
</html>
